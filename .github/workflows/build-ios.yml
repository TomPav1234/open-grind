name: Build iOS

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build release configuration"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "svelte.config.js"
      - "vite.config.mjs"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      APPLE_DEVELOPMENT_TEAM: "1234567890"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Developer Directory
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          pod --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install dependencies & patch crates
        run: |
          bun install
          bun run patch-deps

      - name: Pre-fetch Rust dependencies
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: |
          bun run build

      - name: Inspect Tauri Environment
        run: |
          bun run tauri info || true

      - name: Initialize Tauri iOS project
        run: |
          bun run tauri ios init --ci || bun run tauri ios init

      - name: Install CocoaPods dependencies
        run: |
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple
            pod install || true
            cd ../../..
          fi

      - name: Build iOS app with Tauri CLI
        run: |
          bun run tauri ios build --no-watch --features keychain || true

      - name: Package IPA
        run: |
          # 1. Look for IPA generated by Tauri
          IPA=$(find src-tauri/gen/apple/build -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA" ] && [ -f "$IPA" ]; then
            echo "Found IPA: $IPA"
            cp "$IPA" ./open-grind-ios.ipa
          else
            # 2. Look for compiled .app bundle and package into Payload/
            APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -n 1)
            if [ -n "$APP" ]; then
              echo "Found app bundle: $APP. Packaging into Payload/..."
              rm -rf Payload
              mkdir -p Payload
              cp -R "$APP" Payload/
              zip -qr ./open-grind-ios.ipa Payload/
              echo "open-grind-ios.ipa created successfully!"
            else
              # 3. Direct xcodebuild fallback if needed
              if [ -d "src-tauri/gen/apple" ]; then
                cd src-tauri/gen/apple
                WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" 2>/dev/null | head -n 1)
                SCHEME=$(xcodebuild -list -json 2>/dev/null | jq -r '.workspace.schemes[0] // .project.schemes[0]' 2>/dev/null || echo "open-grind_iOS")
                if [ -n "$WORKSPACE" ]; then
                  xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -destination 'generic/platform=iOS' -archivePath build/open-grind.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" || true
                  if [ -d "build/open-grind.xcarchive/Products/Applications" ]; then
                    mkdir -p Payload
                    cp -R build/open-grind.xcarchive/Products/Applications/*.app Payload/
                    zip -qr ../../../open-grind-ios.ipa Payload/
                  fi
                fi
                cd ../../..
              fi
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-ios-ipa
          path: |
            open-grind-ios.ipa
            src-tauri/gen/apple/**/*.ipa
          if-no-files-found: error
          retention-days: 14
