name: Build iOS

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build release configuration"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - "svelte.config.js"
      - "vite.config.mjs"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: "true"
      NODE_OPTIONS: "--max-old-space-size=4096"
      APPLE_DEVELOPMENT_TEAM: "1234567890"
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Developer Directory
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" -o -name "Xcode.app" 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ] && [ -d "$XCODE_PATH" ]; then
            echo "Selecting Xcode from: $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          fi
          xcodebuild -version
          pod --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Link Rust to system PATH
        run: |
          sudo ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
          sudo ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
          sudo ln -sf "$HOME/.cargo/bin/rustup" /usr/local/bin/rustup
          cargo --version
          rustc --version

      - name: Install dependencies & patch crates
        run: |
          bun install
          bun run patch-deps

      - name: Pre-fetch Rust dependencies
        run: |
          cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: |
          bun run build

      - name: Inspect Tauri Environment
        run: |
          bun run tauri info || true

      - name: Initialize Tauri iOS project
        run: |
          bun run tauri ios init --ci || bun run tauri ios init

      - name: Adjust Xcode Project Compatibility
        run: |
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 60;/g' {} + || true

      - name: Build iOS App and Package IPA
        run: |
          echo "Attempting Tauri iOS build..."
          bun run tauri ios build || true

          # 1. Look for IPA generated by Tauri
          IPA=$(find src-tauri/gen/apple -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA" ] && [ -f "$IPA" ]; then
            echo "Found IPA at: $IPA"
            cp "$IPA" ./open-grind-ios.ipa
          else
            # 2. Look for compiled .app bundle
            APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -n 1)
            if [ -z "$APP" ]; then
              echo "No .app bundle yet. Building with xcodebuild..."
              cd src-tauri/gen/apple

              PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)
              WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)

              if [ -n "$WORKSPACE" ]; then
                TARGET_FLAG="-workspace $WORKSPACE"
                SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json 2>/dev/null | jq -r '.workspace.schemes[0]' 2>/dev/null)
              else
                TARGET_FLAG="-project $PROJECT"
                SCHEME=$(xcodebuild -project "$PROJECT" -list -json 2>/dev/null | jq -r '.project.schemes[0]' 2>/dev/null)
              fi

              if [ -z "$SCHEME" ] || [ "$SCHEME" = "null" ]; then
                SCHEME="open-grind_iOS"
              fi

              echo "Building scheme '$SCHEME' using target '$TARGET_FLAG'..."
              xcodebuild $TARGET_FLAG \
                -scheme "$SCHEME" \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath build/DerivedData \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                DEVELOPMENT_TEAM="" \
                build

              cd ../../..
              APP=$(find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null | head -n 1)
            fi

            if [ -n "$APP" ]; then
              echo "Found app bundle at: $APP. Packaging into open-grind-ios.ipa..."
              rm -rf Payload open-grind-ios.ipa
              mkdir -p Payload
              cp -R "$APP" Payload/
              zip -qr open-grind-ios.ipa Payload/
              echo "open-grind-ios.ipa created successfully!"
            else
              echo "ERROR: Failed to locate or create .app bundle!"
              exit 1
            fi
          fi

          ls -lh open-grind-ios.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-ios-ipa
          path: open-grind-ios.ipa
          if-no-files-found: error
          retention-days: 14
