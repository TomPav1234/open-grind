name: Build iOS

on:
  workflow_dispatch:
    inputs:
      release_build:
        description: "Build release configuration"
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "src-tauri/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/build-ios.yml"

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Install dependencies
        run: |
          bun install
          bun run patch-deps

      - name: Build frontend
        run: |
          bun run build

      - name: Initialize Tauri iOS project
        run: |
          bun run tauri ios init

      - name: Install CocoaPods dependencies
        run: |
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple
            pod install || true
            cd ../../..
          fi

      - name: Compile and package iOS App (.ipa)
        run: |
          # Build rust binary for iOS and invoke xcodebuild
          if [ -d "src-tauri/gen/apple" ]; then
            cd src-tauri/gen/apple

            WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
            PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -n 1)

            SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0] // .workspace.schemes[0]' 2>/dev/null || echo "open-grind_iOS")

            echo "Building scheme: $SCHEME using workspace/project..."
            if [ -n "$WORKSPACE" ]; then
              xcodebuild -workspace "$WORKSPACE" \
                -scheme "$SCHEME" \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath build/open-grind.xcarchive \
                archive \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" || true
            elif [ -n "$PROJECT" ]; then
              xcodebuild -project "$PROJECT" \
                -scheme "$SCHEME" \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath build/open-grind.xcarchive \
                archive \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" || true
            fi

            # Package into IPA
            if [ -d "build/open-grind.xcarchive/Products/Applications" ]; then
              mkdir -p Payload
              cp -R build/open-grind.xcarchive/Products/Applications/*.app Payload/
              zip -qr ../../../open-grind-ios.ipa Payload/
              echo "Created open-grind-ios.ipa successfully!"
            else
              echo "Archive not created by xcodebuild directly, falling back to tauri ios build..."
              cd ../../..
              bun run tauri ios build --no-watch --features keychain || true
              find src-tauri/gen/apple/build -name "*.ipa" -exec cp {} ./open-grind-ios.ipa \; || true
            fi
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-grind-ios-ipa
          path: |
            open-grind-ios.ipa
            src-tauri/gen/apple/build/**/*.ipa
          if-no-files-found: warn
          retention-days: 14
